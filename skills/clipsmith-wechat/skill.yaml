name: clipsmith-wechat
description: Short-lived browser automation skill to export a WeChat public account article into a local folder, including article.md, all embedded images, and optional video.
executor: scripts/run.ts
inputs:
  post_url:
    type: string
    required: false
    description: Full WeChat article URL (mp.weixin.qq.com/s/... or mp.weixin.qq.com/s?__biz=...). If omitted, runner prompts interactively.
  output_dir:
    type: string
    required: false
    default: ~/Downloads/wechat
    description: Target local directory where downloaded assets and metadata files will be stored.
  cdp_port:
    type: string
    required: false
    default: "9223"
    description: Chrome DevTools remote-debugging port used only when browser_mode=cdp.
  profile_dir:
    type: string
    required: false
    default: ~/.clipsmith/browser-profiles/wechat
    description: Chrome user-data-dir used by short-lived headless/headed modes.
  browser_mode:
    type: string
    required: false
    default: headless
    description: Browser mode: headless for short-lived non-visual capture, headed for visible short-lived debugging, or cdp to attach to an existing Chrome.
  keep_open:
    type: boolean
    required: false
    default: false
    description: Keep the headed browser open after capture for manual inspection. Ignored outside headed mode.
  slow_mo_ms:
    type: string
    required: false
    description: Optional Playwright slowMo delay in milliseconds for headed debugging.
  timeout_ms:
    type: string
    required: false
    default: "60000"
    description: Navigation and extraction timeout in milliseconds.
  overwrite:
    type: boolean
    required: false
    default: false
    description: Overwrite existing files with the same generated names if true.
